  if (!t || !t.id || t.is_local || (t.type && t.type !== 'track')) return null;
  return { id: t.id, name: t.name || '', album: t.album?.name || '',
    year: parseInt(t.album?.release_date, 10) || null, artists: (t.artists || []).filter(a => a.id).map(a => ({ id: a.id, name: a.name })) };
}

let mbLast = 0, mbGap = 1200; // MusicBrainz asks for about 1 request a second; widen after a 503 and ease back.
// Returns a list of genre tags for an artist name, [] when MusicBrainz has none, or null when it couldn't be reached.
async function musicBrainzGenres(name, tries = 0) {
  const wait = mbLast + mbGap - Date.now();
  if (wait > 0) await sleep(wait);
  mbLast = Date.now();
  const url = 'https://musicbrainz.org/ws/2/artist/?fmt=json&limit=3&query=' + encodeURIComponent(`artist:"${name.replace(/"/g, '')}"`);
  let r;
  try { r = await fetchWithTimeout(url, { headers: { Accept: 'application/json' } }, 20000); }
  catch (e) { debug.add('MB', `"${name}" → no response (${e.message})`); if (tries < 2) { await sleep(5000); return musicBrainzGenres(name, tries + 1); } return null; }
  debug.add('MB', `"${name}" → ${r.status} ${Date.now() - mbLast}ms`);
  if (r.status === 503 || r.status === 429) {
    mbGap = Math.min(mbGap * 1.5, 5000);
    if (tries < 4) { await sleep(5000 * (tries + 1)); return musicBrainzGenres(name, tries + 1); }
    return null;
  }
  mbGap = Math.max(1200, mbGap * 0.95);
  if (!r.ok) return [];
  const j = await r.json().catch(() => ({}));
  const want = name.toLowerCase();
  const hit = (j.artists || []).find(a => a.name?.toLowerCase() === want && (a.score ?? 0) >= 80) || (j.artists || []).find(a => (a.score ?? 0) >= 95);
  return (hit?.tags || []).filter(t => (t.count ?? 1) > 0).sort((x, y) => (y.count ?? 0) - (x.count ?? 0)).slice(0, 8).map(t => t.name.toLowerCase());
}

// The library is saved after the first read, so opening the app again costs no requests until you tap Refresh.
async function loadLibrary(api, { includeOwn, lookupGenres, refresh }, log) {
  let lib = refresh ? null : store.get('cs.lib');
  if (lib && lib.includeOwn !== includeOwn) lib = null;
  if (lib && lib.v !== 2) { log('Reading your library once more to note which playlist each song came from.'); lib = null; }
  if (lib) {
    log(`Using your library saved ${new Date(lib.at).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' })} (no requests needed)`);
  } else {
    const me = await api.call('GET', '/me');
    log(`Signed in as ${me.display_name || me.id}`);
    const raw = await api.all('/me/playlists?limit=50', n => log(`Found ${plural(n, 'playlist')}`, true));
    const playlists = raw.map(p => ({ id: p.id, name: p.name, owner: { id: p.owner?.id, name: p.owner?.display_name || p.owner?.id },
      collaborative: !!p.collaborative, public: p.public, items: { total: p.items?.total ?? p.tracks?.total ?? 0 } }));
    const saved = await api.all('/me/tracks?limit=50', (n, t) => log(`Reading Liked Songs ${n}/${t}`, true));
    // Each song remembers every place it came from, so you can choose sources later without re-reading.
    const byId = new Map();
    const add = (rows, src) => { for (const t of rows.map(rowTrack).filter(Boolean)) { const have = byId.get(t.id); if (have) { if (!have.src.includes(src)) have.src.push(src); } else byId.set(t.id, { ...t, src: [src] }); } };
    add(saved, 'liked');
    if (includeOwn) {
      // Spotify only lets apps read the songs in playlists you own (since Feb 2026). Collaborative
      // playlists owned by someone else are tried too, and skipped if Spotify refuses.
      const own = playlists.filter(p => p.owner.id === me.id || p.collaborative);
      for (const [i, p] of own.entries()) {
        log(`Reading “${p.name}” (${i + 1}/${own.length})`, true);
        try { add(await api.all(`/playlists/${p.id}/items?limit=50`), p.id); p.read = true; }
        catch (e) { if (e.name === 'AbortError' || /signed in|expired|reach Spotify/i.test(e.message)) throw e; log(`Couldn't read “${p.name}” (${e.message}). Skipping it.`); }
      }
    }
    const tracks = [...byId.values()];
    lib = { v: 2, at: Date.now(), includeOwn, likedTotal: saved.length, me: { id: me.id, display_name: me.display_name }, playlists, tracks };
    store.set('cs.lib', lib);
  }
  log(`${plural(lib.tracks.length, 'unique song')} to sort`);

  // Spotify stopped returning artist genres in Feb 2026, so genres come from MusicBrainz instead:
  // a free, open music database with its own limit (about 1 request a second) that doesn't count against Spotify.
  const cache = store.get('cs.mbgenres', {});
  if (lookupGenres) {
    const artists = new Map();
    for (const t of lib.tracks) { const a = t.artists[0]; if (a && !artists.has(a.id)) artists.set(a.id, a.name); }
    const todo = [...artists].filter(([id]) => !(id in cache));
    // In the Android app, the lookups run in native code inside the background service, so they
    // keep going even if Android freezes this page. The page just collects the results.
    if (NATIVE?.mbStart) {
      if (todo.length) {
        NATIVE.mbStart(JSON.stringify(todo));
        log(`Looking up genres for ${plural(todo.length, 'artist')} in the background, about ${Math.max(1, Math.ceil(todo.length * 1.4 / 60))} min. Already saved: ${artists.size - todo.length}. You can leave the app.`);
      }
      for (;;) {
        let st;
        try { st = JSON.parse(NATIVE.mbPoll()); } catch (e) { debug.add('ERR', 'genre poll failed: ' + e.message); break; }
        Object.assign(cache, st.results);
        store.set('cs.mbgenres', cache);
        for (const l of st.log || []) debug.add('MBN', l);
        log(`Artist genres ${[...artists.keys()].filter(id => id in cache).length}/${artists.size}`, true);
        if (!st.running && !st.left) break;
        if (!st.running && st.left) NATIVE.mbStart('[]'); // nudge the worker if Android stopped it
        await sleep(3000);
      }
      return { ...lib, tracks: lib.tracks.map(t => ({ ...t, uri: t.uri || 'spotify:track:' + t.id })), genres: cache };
    }
    if (todo.length) log(`Looking up genres for ${plural(todo.length, 'artist')} on MusicBrainz, about ${Math.max(1, Math.ceil(todo.length * 1.4 / 60))} min. Already saved: ${artists.size - todo.length}.`);
    let failures = 0;
    for (const [i, [id, name]] of todo.entries()) {
      const r = await musicBrainzGenres(name);
      if (r === null) {
        if (++failures >= 3) { log('MusicBrainz is not answering, so the rest are sorted by song names and years. Tap Refresh later to try again.'); break; }
      } else { failures = 0; cache[id] = r; store.set('cs.mbgenres', cache); } // saved every time, so a reload loses nothing
      if (i % 5 === 4 || i === todo.length - 1) { log(`Artist genres ${artists.size - todo.length + i + 1}/${artists.size}`, true); }
    }
    store.set('cs.mbgenres', cache);
  }
  return { ...lib, tracks: lib.tracks.map(t => ({ ...t, uri: t.uri || 'spotify:track:' + t.id })), genres: cache };
}

/* ---------- Classification ---------- */
function classify(track, genres) {
  const g = track.artists.flatMap(a => genres[a.id] || []).map(s => s.toLowerCase());
  const text = (track.name + ' ' + track.album).toLowerCase();
  const ranked = BUCKETS.map((b, i) => {
    let s = 0;
    for (const gen of g) for (const k of b.kw) if (gen === k || matchWord(gen, k)) s += b.weight || 1;
    for (const k of b.title) if (text.includes(k)) s += 0.75;
    if (b.key === 'throwback' && track.year && track.year < 1990) s += 1.5;
    return [i, s];
  }).filter(([, s]) => s > 0).sort((x, y) => y[1] - x[1] || x[0] - y[0]).map(([i]) => i);
  return { ranked, via: g.length ? 'genre' : 'name' };
}

// Splits one big playlist into decade playlists; decades with few songs share a "Mixed years" playlist.
function splitByDecade(b, minPart = 20) {
  const groups = {};
  for (const t of b.tracks) { const d = t.year ? Math.floor(t.year / 10) * 10 : 0; (groups[d] ||= []).push(t); }
  const parts = [], mixed = [];
  for (const [d, ts] of Object.entries(groups).sort((x, y) => x[0] - y[0])) {
    if (Number(d) && ts.length >= minPart) parts.push({ ...b, key: b.key + d, name: `${b.name} · ${d}s`, tracks: ts, parent: b.key });
    else mixed.push(...ts);
  }
  if (parts.length < 2) return [b];
  if (mixed.length) parts.push({ ...b, key: b.key + 'mix', name: `${b.name} · Mixed years`, tracks: mixed, parent: b.key });
  return parts;
}

// Your hand-sorting wins: a choice for a song beats one for its artist, and both beat the automatic sort.
// 'skip' leaves the song out. A choice pointing at a playlist you switched off falls back to the automatic sort.
function manualFor(t, manual) {
  const m = manual?.songs?.[t.id];
  if (m) return { key: m, by: 'song' };
  const a = t.artists[0] && manual?.artists?.[t.artists[0].id];
  return a ? { key: a, by: 'artist' } : null;
}
function buildPlan(lib, { unsortedToPop, off, split, splitAt, skipSrc, manual }) {
  const buckets = BUCKETS.map(b => ({ ...b, tracks: [] }));
  const unsorted = [], skipped = []; let viaGenre = 0, byHand = 0;
  const where = new Map(); // song id → { key, by }
  const chosen = lib.tracks.filter(t => !t.src || t.src.some(s => !skipSrc.has(s)));
  for (const t of chosen) {
    const m = manualFor(t, manual);
    if (m && m.key === 'skip') { skipped.push(t); byHand++; where.set(t.id, m); continue; }
    if (m && !off.has(m.key)) { const i = BUCKETS.findIndex(b => b.key === m.key); if (i >= 0) { buckets[i].tracks.push(t); byHand++; where.set(t.id, m); continue; } }
    const r = classify(t, lib.genres);
    // A song whose best match is switched off goes to its next-best match that is still on.
    const idx = r.ranked.find(i => !off.has(BUCKETS[i].key));
    if (idx !== undefined) { buckets[idx].tracks.push(t); if (r.via === 'genre') viaGenre++; where.set(t.id, { key: BUCKETS[idx].key, by: 'auto' }); }
    else if (unsortedToPop && !off.has('pop')) { buckets[POP].tracks.push(t); where.set(t.id, { key: 'pop', by: 'none' }); }
    else { unsorted.push(t); where.set(t.id, { key: null, by: 'none' }); }
  }
  const final = buckets.filter(b => !off.has(b.key) && b.tracks.length)
    .flatMap(b => split && b.tracks.length > splitAt ? splitByDecade(b) : [b]);
  return { buckets, final, unsorted, skipped, viaGenre, byHand, where, chosenTracks: chosen, chosen: chosen.length - skipped.length };
}

/* ---------- Automation and undo ---------- */
function makeCaller(api, simulate) {
  return simulate ? async () => { await sleep(90); return { id: 'sim' + Math.random().toString(36).slice(2, 9) }; } : api.call;
}
// Existing playlists are never edited: the only writes are creating new playlists and adding songs to them.
// Progress is saved after every request, so a stopped run resumes without creating anything twice.
async function runAutomation(plan, call, dry, demo, push, setPct, prev) {
  const filled = plan.final;
  const total = filled.reduce((n, b) => n + 1 + Math.ceil(b.tracks.length / 100), 0) || 1;
  let done = 0; const tick = () => setPct(Math.round(++done / total * 100));
  const stamp = new Date().toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
  const resume = !dry && prev && !prev.finished && !!prev.demo === !!demo;
  const journal = resume ? prev : { at: new Date().toISOString(), dry, demo, created: [] };
  const save = () => { if (!dry) store.set('cs.journal', journal); };
  const verb = dry ? 'Would ' : '';
  if (resume) push('Resuming the run that stopped. Nothing is created twice.', 'ok');
  for (const b of filled) {
    const uris = b.tracks.map(t => t.uri);
    let entry = journal.created.find(c => c.key === b.key);
    if (entry) push(`‘${b.name}’ already exists, ${entry.added}/${uris.length} songs added`);
    else {
      push(`${verb}${dry ? 'create' : 'Creating'} ‘${b.name}’ playlist${dry ? '' : '…'}`);
      const pl = await call('POST', '/me/playlists', { name: b.name, public: false, description: `${b.blurb}. Sorted by Crate Sorter on ${stamp}.` });
      entry = { key: b.key, id: pl.id, name: b.name, added: 0 };
      journal.created.push(entry); save();
    }
    tick();
    for (let i = 0; i < uris.length; i += 100) {
      const chunk = uris.slice(i, i + 100);
      if (i >= entry.added) {
        push(`${verb}${dry ? 'add' : 'Adding'} ${chunk.length} tracks to ‘${b.name}’ (${i + chunk.length}/${uris.length})`);
        await call('POST', `/playlists/${entry.id}/items`, { uris: chunk });
        entry.added = i + chunk.length; save();
      }
      tick();
    }
  }
  journal.placed = filled.flatMap(b => b.tracks.map(t => t.uri));
  journal.finished = true; save();
  return journal;
}
async function runUndo(journal, call, push, setPct) {
  const total = journal.created.length || 1;
  let done = 0; const tick = () => setPct(Math.round(++done / total * 100));
  for (const c of journal.created) {
    push(`Removing ‘${c.name}’`);
    try { await call('DELETE', '/me/library?uris=' + encodeURIComponent('spotify:playlist:' + c.id)); }
    catch (e) { push(`Could not remove ‘${c.name}’. Delete it in the Spotify app. (${e.message})`, 'err'); }
    tick();
  }
}

// Optional, and only on request: removes liked songs that are now in the new playlists.
// A private backup playlist with every liked song is made and checked first, and nothing is removed
// unless the backup holds them all. Progress is saved after every request, like the main run.
const LIB_CHUNK = 40; // Spotify's limit for saving or removing library items in one request
async function runClearLiked(st, call, demo, push, setPct) {
  const save = () => store.set('cs.unlike', st);
  const total = Math.ceil(st.backup.length / 100) + 2 + Math.ceil(st.remove.length / LIB_CHUNK);
  let done = 0; const tick = () => setPct(Math.round(++done / total * 100));
  if (!st.backupId) {
    push(`Creating ‘${st.backupName}’ with all ${plural(st.backup.length, 'liked song')}…`);
    const pl = await call('POST', '/me/playlists', { name: st.backupName, public: false, description: 'Copy of your Liked Songs made by Crate Sorter before clearing them. Use Restore in Crate Sorter to like them again.' });
    st.backupId = pl.id; save();
  }
  tick();
  for (let i = st.added; i < st.backup.length; i += 100) {
    const chunk = st.backup.slice(i, i + 100);
    push(`Backing up ${i + chunk.length}/${st.backup.length}`, undefined, true);
    await call('POST', `/playlists/${st.backupId}/items`, { uris: chunk });
    st.added = i + chunk.length; save(); tick();
  }
  if (!st.verified) {
    const r = await call('GET', `/playlists/${st.backupId}/items?limit=1`);
    if (!demo && !(typeof r?.total === 'number' && r.total >= st.backup.length))
      throw new Error(`The backup playlist has ${r?.total ?? 'an unknown number of'} of ${st.backup.length} songs, so nothing was removed from Liked Songs.`);
    st.verified = true; save();
    push(`Backup checked: all ${plural(st.backup.length, 'song')} are in ‘${st.backupName}’.`, 'ok');
  }
  tick();
  for (let i = st.removed; i < st.remove.length; i += LIB_CHUNK) {
    const chunk = st.remove.slice(i, i + LIB_CHUNK);
    push(`Removing from Liked Songs ${i + chunk.length}/${st.remove.length}`, undefined, true);
    await call('DELETE', '/me/library?uris=' + encodeURIComponent(chunk.join(',')));
    st.removed = i + chunk.length; save(); tick();
  }
  st.done = true; save();
}
// Likes the removed songs again, oldest first, so Liked Songs keeps roughly its old order.
async function runRestoreLiked(st, call, push, setPct) {
  const list = st.remove.slice(0, st.removed).reverse();
  const steps = Math.ceil(list.length / LIB_CHUNK) || 1;
  for (let i = st.restored || 0; i < list.length; i += LIB_CHUNK) {
    const chunk = list.slice(i, i + LIB_CHUNK);
    push(`Liking again ${i + chunk.length}/${list.length}`, undefined, true);
    await call('PUT', '/me/library?uris=' + encodeURIComponent(chunk.join(',')));
    st.restored = i + chunk.length; store.set('cs.unlike', st);
    setPct(Math.round((i / LIB_CHUNK + 1) / steps * 100));
  }
  st.restoredAll = true; store.set('cs.unlike', st);
}

}
async function copyText(text, setMsg) {
  if (NATIVE) { try { NATIVE.copy(text); setMsg('Copied'); } catch { setMsg('Copy failed. Select the text and copy it.'); } setTimeout(() => setMsg(''), 2500); return; }
  try { await navigator.clipboard.writeText(text); setMsg('Copied'); }
  catch { setMsg('Copy blocked here. Select the text and copy it.'); }
  setTimeout(() => setMsg(''), 2500);
}

/* ---------- App ---------- */
function App() {
  const [view, setView] = useState('welcome');
  const [clientId, setClientId] = useState(() => store.get('cs.clientId', ''));
  const [includeOwn, setIncludeOwn] = useState(() => store.get('cs.includeOwn', true));
  const [lookupGenres, setLookupGenres] = useState(() => store.get('cs.lookupGenres', true));
  const [demo, setDemo] = useState(false);
  const [lib, setLib] = useState(null);
  const [err, setErr] = useState('');
  const [lines, setLines] = useState([]);
  const [pct, setPct] = useState(0);
  const [unsortedToPop, setUnsortedToPop] = useState(true);
  const [dry, setDry] = useState(true);
  const [confirming, setConfirming] = useState(false);
  const [journal, setJournal] = useState(() => store.get('cs.journal'));
  const [copyMsg, setCopyMsg] = useState('');
  const [openBucket, setOpenBucket] = useState(null);
  const [off, setOff] = useState(() => new Set(store.get('cs.off', [])));
  const [split, setSplit] = useState(() => store.get('cs.split', false));
  const [skipSrc, setSkipSrc] = useState(() => new Set(store.get('cs.skipSrc', [])));
  useEffect(() => { store.set('cs.skipSrc', [...skipSrc]); }, [skipSrc]);
  // Collaborative playlists start unticked: other people's songs only go in when you choose them.
  useEffect(() => {
    if (!lib?.playlists) return;
    const known = new Set(store.get('cs.srcKnown', []));
    const fresh = lib.playlists.filter(p => p.collaborative && !known.has(p.id));
    if (fresh.length) setSkipSrc(s => new Set([...s, ...fresh.map(p => p.id)]));
    store.set('cs.srcKnown', [...known, ...fresh.map(p => p.id)]);
  }, [lib]);
  const [unlike, setUnlike] = useState(() => store.get('cs.unlike'));
  const [manual, setManual] = useState(() => store.get('cs.manual', { songs: {}, artists: {} }));
  useEffect(() => { store.set('cs.manual', manual); }, [manual]);
  const [askRescan, setAskRescan] = useState(false);
  const splitAt = 150;
  const [runKind, setRunKind] = useState('');
  const [busy, setBusy] = useState(false);
  const loadingRef = useRef(false);
  const working = view === 'loading' || busy;
  const [bgOn, setBgOn] = useState(false);
  const [bgWanted, setBgWanted] = useState(() => store.get('cs.background', true));
  useEffect(() => { keepAlive.listen(setBgOn); }, []);
  useEffect(() => { store.set('cs.background', bgWanted); }, [bgWanted]);
  useEffect(() => { if (!working) keepAlive.stop(); else if (NATIVE && !demo) keepAlive.start(); }, [working]);
  const startBackground = () => { setBgWanted(true); keepAlive.start(); };

  // Keep the screen on while working: Android browsers pause or reload pages that go to the background.
  useEffect(() => {
    if (!working || !navigator.wakeLock) return;
    let lock = null, stopped = false;
    const grab = async () => {
      if (stopped || document.hidden) return;
      try { lock = await navigator.wakeLock.request('screen'); debug.add('PAGE', 'screen kept awake'); }
      catch (e) { debug.add('PAGE', 'could not keep screen awake: ' + e.message); }
    };
    grab();
    document.addEventListener('visibilitychange', grab);
    return () => { stopped = true; document.removeEventListener('visibilitychange', grab); lock?.release().catch(() => {}); };
  }, [working]);

  const push = (msg, tone, replaceLast) => { if (!replaceLast) debug.add(tone === 'err' ? 'WARN' : 'LOG', msg); setLines(ls => {
    const t = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    const next = replaceLast && ls.length && ls[ls.length - 1].live ? ls.slice(0, -1) : ls;
    return [...next, { t, msg, tone, live: replaceLast }];
  }); };
  const api = useMemo(() => makeApi(clientId.trim(), (s, why) => {
    const until = new Date(Date.now() + s * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    push(`${why === 'limit' ? 'Spotify asked us to slow down' : why === 'saved' ? 'Still inside the wait Spotify asked for' : 'Connection dropped (often a rate limit)'}. Waiting ${s >= 120 ? Math.round(s / 60) + ' min' : s + 's'}, until ${until}, then carrying on. Keep this page open.`, 'err');
  }), [clientId]);
  const plan = useMemo(() => lib && buildPlan(lib, { unsortedToPop, off, split, splitAt, skipSrc, manual }), [lib, unsortedToPop, off, split, skipSrc, manual]);
  useEffect(() => { store.set('cs.off', [...off]); store.set('cs.split', split); }, [off, split]);

  useEffect(() => { store.set('cs.clientId', clientId.trim()); }, [clientId]);
  useEffect(() => { store.set('cs.includeOwn', includeOwn); store.set('cs.lookupGenres', lookupGenres); }, [includeOwn, lookupGenres]);

  async function load(isDemo, refresh = false) {
    if (!isDemo && refresh && bgWanted) keepAlive.start();
    if (loadingRef.current) return debug.add('LOG', 'Ignored a second load while one is running');
    loadingRef.current = true;
    setErr(''); setLines([]); setView('loading'); setDemo(isDemo);
    try {
      if (isDemo) {
        push('Loading the sample library'); await sleep(400);
        push(`Found ${plural(DEMO.playlists.length, 'playlist')}`); await sleep(300);
        push(`Reading artist genres ${Object.keys(DEMO.genres).length}/${Object.keys(DEMO.genres).length}`); await sleep(300);
        setLib(DEMO);
      } else {
        setLib(await loadLibrary(api, { includeOwn, lookupGenres, refresh }, (m, live) => push(m, undefined, live)));
      }
      setView('dashboard');
    } catch (e) { setErr(e.message); setView('welcome'); }
    loadingRef.current = false;
  }

  // Coming back from Spotify's sign-in page.
  useEffect(() => {
    (async () => {
      try {
        const id = store.get('cs.clientId', '');
        if (await finishLogin(id)) return load(false);
        if (store.get('cs.tok') && id) return load(false);
      } catch (e) { setErr(e.message); }
    })();
  }, []);

  async function connect() {
    setErr('');
    if (!clientId.trim()) return setErr('Paste your Client ID from the Spotify Developer Dashboard first.');
    try { await startLogin(clientId.trim()); } catch (e) { setErr('Could not open Spotify sign-in: ' + e.message); }
  }
  function signOut() { store.del('cs.tok'); setLib(null); setDemo(false); setView('welcome'); }

  async function execute() {
    if (bgWanted && !dry) keepAlive.start();
    setConfirming(false); setLines([]); setPct(0); setBusy(true); setRunKind(dry ? 'dry' : 'run'); setView('running');
    const call = makeCaller(api, demo || dry);
    push(dry ? 'Dry run: nothing in your Spotify account will change.' : demo ? 'Demo run with the sample library.' : 'Starting. Only new playlists will be created.', 'ok');
    try {
      const j = await runAutomation(plan, call, dry, demo, m => push(m), setPct, journal);
      if (!dry) setJournal(j);
      push(dry ? 'Dry run finished. Turn off “Dry run” to do it for real.' : `Done. ${plural(j.created.length, 'new playlist')} created. Your existing playlists were not changed.`, 'ok');
    } catch (e) {
      push(e.message, 'err');
      push('Stopped. Progress is saved: tap “Resume automation” to carry on, or undo below.', 'err');
      if (!dry) setJournal(store.get('cs.journal'));
    }
    setBusy(false);
  }
  async function undo() {
    if (!journal) return;
    setLines([]); setPct(0); setBusy(true); setRunKind('undo'); setView('running');
    const j = structuredClone(journal);
    await runUndo(j, makeCaller(api, demo || j.demo), (m, tone) => push(m, tone), setPct);
    push('Undo finished.', 'ok');
    store.del('cs.journal'); setJournal(null); setBusy(false);
  }

  // Liked songs that are safely in the new playlists. Songs that didn't go anywhere stay liked.
  const clearable = useMemo(() => {
    if (!lib || !journal?.finished || journal.dry || !!journal.demo !== !!demo) return null;
    const placed = new Set(journal.placed || plan.final.filter(b => journal.created.some(c => c.key === b.key && c.added >= b.tracks.length)).flatMap(b => b.tracks.map(t => t.uri)));
    const liked = lib.tracks.filter(t => !t.src || t.src.includes('liked'));
    return { backup: liked.map(t => t.uri), remove: liked.filter(t => placed.has(t.uri)).map(t => t.uri) };
  }, [lib, journal, demo, plan]);
  async function clearLiked() {
    const st = unlike && !unlike.done ? structuredClone(unlike) : {
      at: new Date().toISOString(), demo,
      backupName: `Liked Songs backup ${new Date().toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' })}`,
      backup: clearable.backup, remove: clearable.remove, added: 0, removed: 0,
    };
    if (bgWanted && !demo) keepAlive.start();
    setLines([]); setPct(0); setBusy(true); setRunKind('clear'); setView('running');
    push(demo ? 'Demo: nothing in a real account changes.' : 'Clearing Liked Songs. A backup playlist is made and checked first.', 'ok');
    try {
      await runClearLiked(st, makeCaller(api, demo), demo, push, setPct);
      push(`Done. ${plural(st.removed, 'song')} removed from Liked Songs. They're all in your new playlists and in ‘${st.backupName}’.`, 'ok');
    } catch (e) {
      push(e.message, 'err');
      push('Stopped. Progress is saved: tap “Resume clearing” to carry on, or Restore to like them again.', 'err');
    }
    setUnlike(store.get('cs.unlike')); setBusy(false);
  }
  async function restoreLiked() {
    const st = structuredClone(unlike);
    if (bgWanted && !st.demo) keepAlive.start();
    setLines([]); setPct(0); setBusy(true); setRunKind('restore'); setView('running');
    try {
      await runRestoreLiked(st, makeCaller(api, st.demo), push, setPct);
      push(`Done. ${plural(st.restored, 'song')} are back in Liked Songs. ‘${st.backupName}’ is still there; delete it in Spotify when you no longer need it.`, 'ok');
      store.del('cs.unlike'); setUnlike(null);
    } catch (e) {
      push(e.message, 'err'); push('Stopped. Tap Restore again to carry on.', 'err'); setUnlike(store.get('cs.unlike'));
    }
    setBusy(false);
  }

  function report() {
    const g = store.get('cs.mbgenres', {}), saved = store.get('cs.lib'), lines = debug.lines();
    const statuses = {};
    for (const l of lines) { const m = l.match(/ REQ .* → (\d{3})/); if (m) statuses[m[1]] = (statuses[m[1]] || 0) + 1; }
    const bu = store.get('cs.blockedUntil', 0);
    return [
      'Crate Sorter troubleshooting log',
      `Version ${APP_VERSION}${NATIVE?.appVersion ? ` · app v${NATIVE.appVersion()}` : ''} · ${new Date().toISOString()}`,
      `Browser: ${navigator.userAgent}`,
      `Page: ${REDIRECT}${IN_PREVIEW ? ' (preview frame)' : ''}${NATIVE ? ` · Android app, battery ${NATIVE.batteryUnrestricted() ? 'unrestricted' : 'optimized'}` : ''} · Client ID set: ${clientId.trim() ? 'yes' : 'no'} · Signed in: ${store.get('cs.tok') ? 'yes' : 'no'}`,
      `View: ${view} · Busy: ${busy} · Demo: ${demo}`,
      `Settings: dryRun=${dry} genres=${lookupGenres} ownPlaylists=${includeOwn} split=${split} unsortedToPop=${unsortedToPop} off=[${[...off].join(',')}]`,
      `Saved library: ${saved ? `${saved.tracks.length} songs, ${saved.playlists.length} playlists, read ${new Date(saved.at).toISOString()}, format ${saved.v || 1}` : 'none'}`,
      `Sources skipped: ${skipSrc.size ? [...skipSrc].join(',') : 'none'}`,
      `Hand-sorted: ${Object.keys(manual.songs).length} songs, ${Object.keys(manual.artists).length} artists set; ${plan ? `${plan.byHand} songs placed by hand, ${plan.skipped.length} left out` : 'no plan'}`,
      `Liked Songs clearing: ${unlike ? `backup ${unlike.added}/${unlike.backup.length}${unlike.verified ? ' checked' : ''}, removed ${unlike.removed}/${unlike.remove.length}, restored ${unlike.restored || 0}${unlike.demo ? ' (demo)' : ''}` : 'none'}`,
      `MusicBrainz genres saved: ${Object.keys(g).length} (${Object.values(g).filter(v => !v.length).length} with no genres)`,
      `Pace: ${Math.round(store.get('cs.gap', MIN_GAP))}ms between requests · Wait until: ${bu > Date.now() ? new Date(bu).toISOString() : 'none'}`,
      plan ? `Plan: ${plan.final.map(b => `${b.name}=${b.tracks.length}`).join(', ')} · unsorted=${plan.unsorted.length} · byGenre=${plan.viaGenre}` : 'Plan: none',
      journal ? `Last run: ${journal.finished ? 'finished' : 'NOT finished'}, started ${journal.at}${journal.demo ? ' (demo)' : ''} · ${journal.created.map(c => `${c.name} ${c.added ?? '?'} added`).join(', ') || 'nothing created'}` : 'Last run: none',
      `Responses by status: ${Object.entries(statuses).map(([k, v]) => `${k}×${v}`).join(' ') || 'none'}`,
      `--- last ${lines.length} events, oldest first ---`,
      ...lines,
    ].join('\n');
  }

  const hasUndo = journal && journal.created && journal.created.length > 0;
  const canResume = journal && !journal.finished && !!journal.demo === demo;

  return (
    <div className="mx-auto max-w-xl pt-4 pb-48 flex flex-col gap-4">
      <header className="flex items-center justify-between gap-3">
        <div className="flex items-center gap-2">
          <span className="grid h-9 w-9 place-items-center rounded-xl bg-accent text-accent-fg"><Icon name="list" className="w-5 h-5" /></span>
          <span className="font-display text-xl font-bold tracking-tight">Crate Sorter</span>
          <span className="whitespace-nowrap rounded-full border border-line px-2 py-0.5 text-xs text-muted num" title="Version">{NATIVE?.appVersion ? 'v' + NATIVE.appVersion() : 'web ' + APP_VERSION}</span>
        </div>
        {lib && (
          <div className="flex items-center gap-2 text-sm">
            <span className="rounded-full border border-line px-2.5 py-1 text-muted">{demo ? 'Sample library' : lib.me.display_name || lib.me.id}</span>
            {!busy && <button onClick={signOut} className="rounded-lg p-2 text-muted hover:text-fg" aria-label="Sign out"><Icon name="logout" /></button>}
          </div>
        )}
      </header>

      {err && <Notice tone="danger"><strong className="block">Something went wrong</strong>{err}</Notice>}

      {view === 'welcome' && (
        <>
          <section className="flex flex-col gap-3 pt-2">
            <p className="eyebrow">Spotify library reset</p>
            <h1 className="text-[2rem] leading-[1.1] font-bold">Ten playlists instead of a hundred.</h1>
            <p className="text-muted">Crate Sorter reads your Liked Songs, looks up each artist's genres, and files every song into one of ten mood and genre playlists. It only adds new playlists: your existing playlists, their names and their songs are never changed. You see the full plan first, and you can remove the new playlists again with one tap.</p>
          </section>
          <BucketGrid buckets={BUCKETS} />

          <Panel className="flex flex-col gap-3">
            <h2 className="text-lg font-bold">Connect your account</h2>
            {IN_PREVIEW ? (
              <Notice tone="accent" icon="eye">
                This preview window can't reach Spotify, so connecting only works from the hosted copy of this page. You can still try the whole flow here with a sample library. Nothing is sent anywhere.
              </Notice>
            ) : null}
            <label htmlFor="cid" className="text-sm font-medium">Spotify Client ID</label>
            <input id="cid" value={clientId} onChange={e => setClientId(e.target.value)} placeholder="32 characters from developer.spotify.com"
              className="w-full rounded-xl border border-line bg-bg px-3 py-3 font-mono text-sm" autoComplete="off" spellCheck="false" />
            <div className="text-sm">
              <span className="text-muted">Redirect URI to register:</span>
              <div className="mt-1 flex items-center gap-2">
                <code className="min-w-0 flex-1 overflow-x-auto whitespace-nowrap rounded-lg border border-line bg-bg px-2 py-1.5 font-mono text-xs select-all">{REDIRECT}</code>
                <button onClick={() => copyText(REDIRECT, setCopyMsg)} className="rounded-lg border border-line p-2" aria-label="Copy redirect URI"><Icon name="copy" /></button>
              </div>
              {copyMsg && <span className="text-xs text-muted">{copyMsg}</span>}
            </div>
            <Toggle id="genres" checked={lookupGenres} onChange={setLookupGenres} label="Look up genres on MusicBrainz"
              hint="Better sorting. Spotify no longer shares genres, so artist names are looked up in MusicBrainz, a free music database. About 1 artist a second the first time, then saved. Uses no Spotify requests." />
            <Toggle id="own" checked={includeOwn} onChange={setIncludeOwn} label="Read songs from my own playlists"
              hint="Lets you choose which of your playlists to sort, as well as Liked Songs. Adds one request per playlist the first time." />
            <Btn onClick={connect} disabled={IN_PREVIEW} className="w-full text-base py-4"><Icon name="music" className="w-5 h-5" />Connect &amp; Automatically Sync Spotify</Btn>
            <Btn kind="ghost" onClick={() => load(true)} className="w-full"><Icon name="eye" />Try it with a sample library</Btn>
            <details className="rounded-xl border border-line p-3 text-sm">
              <summary className="flex items-center justify-between font-medium">First-time setup (5 minutes)<Icon name="chevron" /></summary>
              <ol className="mt-2 list-decimal pl-5 space-y-1 text-muted">
                <li>Open developer.spotify.com/dashboard and sign in. Spotify requires the app owner to have Premium.</li>
                <li>Create app. Name it anything, tick “Web API”.</li>
                <li>Paste the redirect URI above into “Redirect URIs” exactly, including the trailing path. It must be HTTPS.</li>
                <li>Copy the Client ID into the box above. No client secret is needed.</li>
                <li>In User Management, add the email of every Spotify account that will use it (up to 5).</li>
              </ol>
            </details>
          </Panel>

          {hasUndo && (
            <UndoPanel journal={journal} onUndo={undo}
              needsLogin={!journal.demo && !store.get('cs.tok')} copy={() => copyText(JSON.stringify(journal, null, 2), setCopyMsg)} copyMsg={copyMsg} />
          )}
        </>
      )}

      {view === 'loading' && (
        <Panel className="flex flex-col gap-3">
          <div className="flex items-center gap-2 font-semibold"><Icon name="loader" className="w-5 h-5 spin text-accent" />Reading your library</div>
          <p className="text-sm text-muted">The first genre lookup takes a while for a big library (about 1 artist a second). Progress is saved as it goes, so nothing is lost if it stops.</p>
          <Log lines={lines} />
          {!demo && (bgOn ? (
            NATIVE ? (
              <Notice tone="ok" icon="check">
                <strong className="block">Running in the background</strong>
                <span className="block">You can lock your phone, switch apps and play music. A “Crate Sorter is working” notification shows until it finishes. Don't swipe the app away from your recent apps.</span>
                {!NATIVE.batteryUnrestricted() && (
                  <Btn kind="ghost" className="w-full py-2 mt-2" onClick={() => NATIVE.askBattery()}>Allow unrestricted battery (recommended)</Btn>
                )}
              </Notice>
            ) : (
            <Notice tone="ok" icon="check">
              <strong className="block">Background mode is on</strong>
              You can lock your phone or use other apps. A “Crate Sorter is working” media notification shows until it finishes. Pausing it there turns background mode off.
            </Notice>
            )
          ) : (
            <Notice tone="warn" icon="alert">
              <strong className="block">This stops if you leave the page</strong>
              <span className="block mb-2">Tap below to keep it working while your phone is locked or you use other apps.</span>
              <Btn kind="ghost" className="w-full py-2" onClick={startBackground}><Icon name="play" />Keep working in the background</Btn>
            </Notice>
          ))}
        </Panel>
      )}

      {view === 'dashboard' && plan && (
        <>
          {demo && <Notice tone="accent" icon="eye">You're looking at a sample library. Every button works, and nothing touches a real account.</Notice>}
          <div className="grid grid-cols-3 gap-2">
            {[[plan.chosen, plan.chosen === lib.tracks.length ? 'songs found' : `of ${lib.tracks.length.toLocaleString()} songs used`], [plan.final.length, 'new playlists'], [lib.playlists.length, 'left untouched']].map(([n, l]) => (
              <div key={l} className="rounded-xl border border-line bg-surface p-3">
                <div className="font-display text-2xl font-bold num">{n.toLocaleString()}</div>
                <div className="text-xs text-muted">{l}</div>
              </div>
            ))}
          </div>
          <p className="text-sm text-muted -mt-1 num">
            {lib.tracks.length ? Math.round(plan.viaGenre / lib.tracks.length * 100) : 0}% sorted by genre, the rest by song names and release year.
            {plan.byHand > 0 && ` ${plural(plan.byHand, 'song')} sorted by you${plan.skipped.length ? `, ${plan.skipped.length} left out` : ''}.`}
          </p>
          <Btn kind="ghost" onClick={() => { setView('sorter'); window.scrollTo(0, 0); }} className="w-full"><Icon name="list" />Sort by hand{plan.byHand ? ` (${plan.byHand.toLocaleString()} so far)` : ''}</Btn>
          {!demo && lib.at && (
            <div className="flex items-center justify-between gap-3 text-sm text-muted -mt-1">
              <span>Library saved {new Date(lib.at).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' })}. Reopening the app uses this copy.</span>
              <button onClick={() => setAskRescan(true)} className="shrink-0 rounded-lg border border-line px-3 py-1.5 text-fg">Refresh</button>
            </div>
          )}
          {askRescan && (
            <Notice tone="warn" icon="alert">
              <strong className="block">Read your whole library again?</strong>
              <span className="block mb-2">This uses about {Math.ceil((lib.likedTotal ?? lib.tracks.length) / 50) + 2 + (lib.includeOwn ? lib.playlists.filter(p => p.owner?.id === lib.me.id || p.collaborative).length : 0)} Spotify requests and can take a while. Genres already found are kept, and your choices stay as they are.</span>
              <div className="grid grid-cols-2 gap-2">
                <Btn kind="ghost" className="py-2" onClick={() => setAskRescan(false)}>Cancel</Btn>
                <Btn className="py-2" onClick={() => { setAskRescan(false); load(false, true); }}>Read again</Btn>
              </div>
            </Notice>
          )}

          <Panel className="flex flex-col gap-3">
            <div className="flex items-baseline justify-between gap-2"><h2 className="text-lg font-bold">New playlists</h2><span className="text-sm text-muted num">{plan.final.length} will be created</span></div>
            <ul className="flex flex-col divide-y divide-[var(--line)]">
              {plan.buckets.map(b => (
                <li key={b.key} className={'py-2 flex items-start gap-3 ' + (off.has(b.key) ? 'opacity-50' : '')}>
                  <input id={'on' + b.key} type="checkbox" aria-label={'Create ' + b.name} className="mt-1.5 h-4 w-4 accent-[var(--accent)]" checked={!off.has(b.key)}
                    onChange={e => setOff(s => { const n = new Set(s); e.target.checked ? n.delete(b.key) : n.add(b.key); return n; })} />
                  <div className="min-w-0 flex-1">
                  <button className="flex w-full items-center gap-3 text-left" onClick={() => setOpenBucket(openBucket === b.key ? null : b.key)} aria-expanded={openBucket === b.key}>
                    <span className="h-3 w-3 rounded-full" style={{ background: dot(b.hue) }} />
                    <span className="min-w-0 flex-1">
                      <span className="block font-semibold">{b.name}</span>
                      <span className="block truncate text-xs text-muted">{off.has(b.key) ? 'Off. Its songs go to their next-best match.' : b.tracks.length ? b.tracks.slice(0, 3).map(t => t.name).join(' · ') : 'No songs matched. This playlist will be skipped.'}</span>
                      {(() => { const parts = plan.final.filter(f => f.parent === b.key); return parts.length ? <span className="block text-xs text-accent">Splits into {parts.map(f => f.name.split(' · ')[1]).join(', ')}</span> : null; })()}
                    </span>
                    <span className="num text-sm font-semibold">{b.tracks.length}</span>
                    <Icon name="chevron" className={'w-4 h-4 text-muted transition ' + (openBucket === b.key ? 'rotate-180' : '')} />
                  </button>
                  {openBucket === b.key && b.tracks.length > 0 && (
                    <ul className="mt-2 max-h-56 overflow-y-auto rounded-lg bg-bg p-2 text-sm">
                      {b.tracks.map(t => <li key={t.id} className="flex justify-between gap-2 py-0.5"><span className="min-w-0 truncate">{t.name}</span><span className="shrink-0 text-muted truncate max-w-[45%]">{t.artists.map(a => a.name).join(', ')}</span></li>)}
                    </ul>
                  )}
                  </div>
                </li>
              ))}
            </ul>
            <Toggle id="split" checked={split} onChange={setSplit} label={`Split playlists over ${splitAt} songs by decade`}
              hint="For example Rock & Alt · 1990s and Rock & Alt · 2010s. Gives you more, smaller playlists." />
            <Toggle id="unsorted" checked={unsortedToPop} onChange={setUnsortedToPop} label="Put songs with no match into Pop"
              hint={unsortedToPop ? 'Every song lands somewhere.' : `${plural(plan.unsorted.length, 'song')} will be left out.`} />
          </Panel>

          <SourcePicker lib={lib} skipSrc={skipSrc} setSkipSrc={setSkipSrc} />

          {(unlike || clearable) && <ClearLikedPanel unlike={unlike} clearable={clearable} onClear={clearLiked} onRestore={restoreLiked} />}

          {hasUndo && (
            <UndoPanel journal={journal} onUndo={undo} blocked={unlike && unlike.removed > 0 && !unlike.restoredAll}
              copy={() => copyText(JSON.stringify(journal, null, 2), setCopyMsg)} copyMsg={copyMsg} />
          )}

          <div className="fixed inset-x-0 bottom-0 z-10 border-t border-line bg-surface"
            style={{ paddingBottom: 'calc(env(safe-area-inset-bottom, 0px) + 12px)', paddingTop: 12, paddingLeft: 'max(16px, env(safe-area-inset-left, 0px))', paddingRight: 'max(16px, env(safe-area-inset-right, 0px))' }}>
            <div className="mx-auto max-w-xl flex flex-col gap-2">
              {confirming ? (
                <>
                  <p className="text-sm">
                    {dry ? 'Dry run: ' : <strong>This adds playlists to your account. </strong>}
                    Create {plural(plan.final.length, 'private playlist')} holding {plural(plan.final.reduce((n, b) => n + b.tracks.length, 0), 'song')}. Your existing playlists won't change.
                  </p>
                  <div className="grid grid-cols-2 gap-2">
                    <Btn kind="ghost" onClick={() => setConfirming(false)}><Icon name="x" />Cancel</Btn>
                    <Btn onClick={execute}><Icon name="check" />{dry ? 'Run preview' : 'Yes, do it'}</Btn>
                  </div>
                </>
              ) : (
                <>
                  <Toggle id="dry" checked={dry} onChange={setDry} label="Dry run" hint={dry ? 'Shows every step without changing anything.' : 'Real run. New playlists can be removed with Undo.'} />
                  <Btn onClick={() => setConfirming(true)} className="w-full text-base py-4"><Icon name="play" className="w-5 h-5" />{canResume && !dry ? 'Resume automation' : 'Start Full Automation'}</Btn>
                </>
              )}
            </div>
          </div>
        </>
      )}

      {view === 'sorter' && plan && (
        <HandSorter plan={plan} off={off} manual={manual} setManual={setManual} onDone={() => { setView('dashboard'); window.scrollTo(0, 0); }} />
      )}

      {view === 'running' && (
        <Panel className="flex flex-col gap-3">
          <div className="flex items-center justify-between gap-2">
            <h2 className="flex items-center gap-2 text-lg font-bold">
              {busy ? <Icon name="loader" className="w-5 h-5 spin text-accent" /> : <Icon name="check" className="w-5 h-5 text-ok" />}
              {{ undo: 'Undoing', dry: 'Dry run', clear: 'Clearing Liked Songs', restore: 'Restoring Liked Songs' }[runKind] || 'Automation'}{busy ? '…' : ' finished'}
            </h2>
            <span className="num font-semibold">{pct}%</span>
          </div>
          <Progress pct={pct} />
          <Log lines={lines} />
          {busy && runKind !== 'dry' && (<>
          {!demo && (bgOn ? (
            NATIVE ? (
              <Notice tone="ok" icon="check">
                <strong className="block">Running in the background</strong>
                <span className="block">You can lock your phone, switch apps and play music. A “Crate Sorter is working” notification shows until it finishes. Don't swipe the app away from your recent apps.</span>
                {!NATIVE.batteryUnrestricted() && (
                  <Btn kind="ghost" className="w-full py-2 mt-2" onClick={() => NATIVE.askBattery()}>Allow unrestricted battery (recommended)</Btn>
                )}
              </Notice>
            ) : (
            <Notice tone="ok" icon="check">
              <strong className="block">Background mode is on</strong>
              You can lock your phone or use other apps. A “Crate Sorter is working” media notification shows until it finishes. Pausing it there turns background mode off.
            </Notice>
            )
          ) : (
            <Notice tone="warn" icon="alert">
              <strong className="block">This stops if you leave the page</strong>
              <span className="block mb-2">Tap below to keep it working while your phone is locked or you use other apps.</span>
              <Btn kind="ghost" className="w-full py-2" onClick={startBackground}><Icon name="play" />Keep working in the background</Btn>
            </Notice>
          ))}
          </>)}
          {!busy && (
            <div className="flex flex-col gap-2">
              <Btn kind="ghost" onClick={() => setView(lib ? 'dashboard' : 'welcome')} className="w-full">Back to the plan</Btn>
              {runKind === 'run' && clearable && !unlike && <ClearLikedPanel clearable={clearable} onClear={clearLiked} />}
              {(runKind === 'clear' || runKind === 'restore') && unlike && <ClearLikedPanel unlike={unlike} clearable={clearable} onClear={clearLiked} onRestore={restoreLiked} />}
              {hasUndo && runKind === 'run' && (
                <UndoPanel journal={journal} onUndo={undo} blocked={unlike && unlike.removed > 0 && !unlike.restoredAll}
                  copy={() => copyText(JSON.stringify(journal, null, 2), setCopyMsg)} copyMsg={copyMsg} />
              )}
            </div>
          )}
        </Panel>
      )}
      <TroublePanel report={report} />
    </div>
  );
}

// Sort songs or whole artists by hand. Pick a playlist at the top, then tap songs to drop them in;
// or tap a song with nothing picked to choose for just that one.
function HandSorter({ plan, off, manual, setManual, onDone }) {
  const [mode, setMode] = useState('songs');
  const [q, setQ] = useState('');
  const [show, setShow] = useState('all');
  const [brush, setBrush] = useState(null);
  const [open, setOpen] = useState(null);
  const [limit, setLimit] = useState(60);
  const [confirmReset, setConfirmReset] = useState(false);
  useEffect(() => setLimit(60), [mode, q, show]);
  const targets = [...BUCKETS.filter(b => !off.has(b.key)).map(b => ({ key: b.key, name: b.name, hue: b.hue })), { key: 'skip', name: 'Leave out', hue: null }];
  const nameOf = k => k === 'skip' ? 'Left out' : BUCKETS.find(b => b.key === k)?.name || 'Not sorted';
  const hueOf = k => BUCKETS.find(b => b.key === k)?.hue;
  const set = (kind, id, key) => setManual(m => {
    const next = { songs: { ...m.songs }, artists: { ...m.artists } };
    if (key == null) delete next[kind][id]; else next[kind][id] = key;
    return next;
  });
  const needle = q.trim().toLowerCase();

  const songs = useMemo(() => plan.chosenTracks.map(t => ({ t, w: plan.where.get(t.id) || { key: null, by: 'none' } })), [plan]);
  const artists = useMemo(() => {
    const m = new Map();
    for (const { t, w } of songs) {
      const a = t.artists[0]; if (!a) continue;
      const e = m.get(a.id) || { id: a.id, name: a.name, n: 0, keys: {}, own: 0 };
      e.n++; if (w.key) e.keys[w.key] = (e.keys[w.key] || 0) + 1; if (w.by === 'song') e.own++;
      m.set(a.id, e);
    }
    return [...m.values()].map(e => ({ ...e, top: Object.entries(e.keys).sort((x, y) => y[1] - x[1])[0]?.[0] || null })).sort((x, y) => y.n - x.n || x.name.localeCompare(y.name));
  }, [songs]);

  const list = mode === 'songs'
    ? songs.filter(({ t, w }) => (!needle || (t.name + ' ' + t.artists.map(a => a.name).join(' ') + ' ' + t.album).toLowerCase().includes(needle))
        && (show === 'all' || (show === 'hand' ? w.by === 'song' || w.by === 'artist' : show === 'auto' ? w.by === 'auto' || w.by === 'none' : w.by === 'none')))
    : artists.filter(a => (!needle || a.name.toLowerCase().includes(needle))
        && (show === 'all' || (show === 'hand' ? !!manual.artists[a.id] : show === 'auto' ? !manual.artists[a.id] : !a.top)));
  const handCount = Object.keys(manual.songs).length + Object.keys(manual.artists).length;

  const Chips = ({ current, onPick }) => (
    <div className="flex flex-wrap gap-1.5 pt-2">
      {targets.map(b => (
        <button key={b.key} onClick={() => onPick(b.key)}
          className={'flex items-center gap-1.5 rounded-full border px-3 py-1.5 text-sm ' + (current === b.key ? 'border-accent text-accent font-semibold' : 'border-line')}>
          {b.hue != null ? <span className="h-2.5 w-2.5 rounded-full" style={{ background: dot(b.hue) }} /> : <Icon name="x" className="w-3.5 h-3.5" />}{b.name}
        </button>
      ))}
      {current && <button onClick={() => onPick(null)} className="rounded-full border border-line px-3 py-1.5 text-sm text-muted">Back to automatic</button>}
    </div>
  );
  const Badge = ({ k, by }) => (
    <span className="flex shrink-0 items-center gap-1 text-xs">
      {hueOf(k) != null && <span className="h-2.5 w-2.5 rounded-full" style={{ background: dot(hueOf(k)) }} />}
      <span className={by === 'song' || by === 'artist' ? 'font-semibold' : 'text-muted'}>{nameOf(k)}</span>
      {(by === 'song' || by === 'artist') && <span className="rounded border border-accent px-1 text-[10px] text-accent">{by === 'song' ? 'you' : 'artist'}</span>}
    </span>
  );

  function tapSong(t, w) {
    if (brush) set('songs', t.id, manual.songs[t.id] === brush ? null : brush);
    else setOpen(open === t.id ? null : t.id);
  }
  function tapArtist(a) {
    if (brush) set('artists', a.id, manual.artists[a.id] === brush ? null : brush);
    else setOpen(open === a.id ? null : a.id);
  }

  return (
    <div className="flex flex-col gap-3">
      <div className="sticky top-0 z-10 -mx-4 flex flex-col gap-2 border-b border-line bg-bg px-4 pb-3 pt-2">
        <div className="flex items-center justify-between gap-2">
          <h2 className="text-lg font-bold">Sort by hand</h2>
          <Btn onClick={onDone} className="py-2 px-4"><Icon name="check" />Done</Btn>
        </div>
        <div className="grid grid-cols-2 gap-1 rounded-xl border border-line p-1 text-sm">
          {[['songs', 'Songs'], ['artists', 'Artists']].map(([k, l]) => (
            <button key={k} onClick={() => { setMode(k); setOpen(null); }} className={'rounded-lg py-1.5 ' + (mode === k ? 'bg-accent text-accent-fg font-semibold' : '')}>{l}</button>
          ))}
        </div>
        <input type="search" value={q} onChange={e => setQ(e.target.value)} placeholder={mode === 'songs' ? 'Search songs, artists, albums' : 'Search artists'}
          className="rounded-lg border border-line bg-surface px-3 py-2 text-base" aria-label="Search" />
        <div className="flex gap-1.5 overflow-x-auto text-xs">
          {[['all', 'All'], ['auto', 'Automatic'], ['hand', 'Set by you'], ['none', 'No match']].map(([k, l]) => (
            <button key={k} onClick={() => setShow(k)} className={'shrink-0 rounded-full border px-3 py-1 ' + (show === k ? 'border-accent text-accent font-semibold' : 'border-line text-muted')}>{l}</button>
          ))}
        </div>
        <div>
          <p className="text-xs text-muted">{brush ? <>Tap {mode} to put them in <strong className="text-fg">{nameOf(brush)}</strong>. Tap again to undo.</> : <>Pick a playlist, then tap {mode} to drop them in. Or tap one {mode === 'songs' ? 'song' : 'artist'} to choose just for it.</>}</p>
          <div className="mt-1 flex gap-1.5 overflow-x-auto pb-1">
            {targets.map(b => (
              <button key={b.key} onClick={() => setBrush(brush === b.key ? null : b.key)}
                className={'flex shrink-0 items-center gap-1.5 rounded-full border px-3 py-1.5 text-sm ' + (brush === b.key ? 'border-accent bg-accent text-accent-fg font-semibold' : 'border-line bg-surface')}>
                {b.hue != null ? <span className="h-2.5 w-2.5 rounded-full" style={{ background: dot(b.hue) }} /> : <Icon name="x" className="w-3.5 h-3.5" />}{b.name}
              </button>
            ))}
          </div>
        </div>
      </div>

      <p className="text-xs text-muted num">
        {plural(list.length, mode === 'songs' ? 'song' : 'artist')} shown. Your choice for a song beats your choice for its artist, and both beat the automatic sort.
      </p>

      <ul className="flex flex-col divide-y divide-[var(--line)] rounded-xl border border-line bg-surface">
        {list.slice(0, limit).map(item => mode === 'songs' ? (() => {
          const { t, w } = item;
          return (
            <li key={t.id} className="px-3 py-2">
              <button className="flex w-full items-center gap-3 text-left" onClick={() => tapSong(t, w)} aria-expanded={open === t.id}>
                <span className="min-w-0 flex-1">
                  <span className="block truncate text-sm font-medium">{t.name}</span>
                  <span className="block truncate text-xs text-muted">{t.artists.map(a => a.name).join(', ')}{t.year ? ` · ${t.year}` : ''}</span>
                </span>
                <Badge k={w.key} by={w.by} />
              </button>
              {open === t.id && !brush && <Chips current={manual.songs[t.id]} onPick={k => { set('songs', t.id, k); setOpen(null); }} />}
            </li>
          );
        })() : (
          <li key={item.id} className="px-3 py-2">
            <button className="flex w-full items-center gap-3 text-left" onClick={() => tapArtist(item)} aria-expanded={open === item.id}>
              <span className="min-w-0 flex-1">
                <span className="block truncate text-sm font-medium">{item.name}</span>
                <span className="block truncate text-xs text-muted num">{plural(item.n, 'song')}{item.own ? ` · ${item.own} set one by one` : ''}</span>
              </span>
              <Badge k={manual.artists[item.id] || item.top} by={manual.artists[item.id] ? 'artist' : 'auto'} />
            </button>
            {open === item.id && !brush && <Chips current={manual.artists[item.id]} onPick={k => { set('artists', item.id, k); setOpen(null); }} />}
          </li>
        ))}
        {!list.length && <li className="px-3 py-6 text-center text-sm text-muted">Nothing matches.</li>}
      </ul>
      {list.length > limit && <Btn kind="ghost" onClick={() => setLimit(l => l + 100)}>Show more ({(list.length - limit).toLocaleString()} left)</Btn>}

      {handCount > 0 && (confirmReset ? (
        <Notice tone="warn" icon="alert">
          <strong className="block">Clear all {handCount} of your choices?</strong>
          <span className="block mb-2">Every song goes back to the automatic sort.</span>
          <div className="grid grid-cols-2 gap-2">
            <Btn kind="ghost" className="py-2" onClick={() => setConfirmReset(false)}>Cancel</Btn>
            <Btn kind="danger" className="py-2" onClick={() => { setManual({ songs: {}, artists: {} }); setConfirmReset(false); }}>Clear them</Btn>
          </div>
        </Notice>
      ) : (
        <button className="text-sm text-muted underline self-center" onClick={() => setConfirmReset(true)}>Clear all my choices ({handCount})</button>
      ))}
    </div>
  );
}

// Where songs come from, and which playlists involve other people.
function SourcePicker({ lib, skipSrc, setSkipSrc }) {
  const me = lib.me.id;
  const counts = useMemo(() => {
    const c = {};
    for (const t of lib.tracks) for (const s of t.src || []) c[s] = (c[s] || 0) + 1;
    return c;
  }, [lib]);
  const mine = lib.playlists.filter(p => p.owner?.id === me && !p.collaborative);
  const shared = lib.playlists.filter(p => p.collaborative);
  const others = lib.playlists.filter(p => p.owner?.id !== me && !p.collaborative);
  const pickable = p => !!p.read;
  const ids = ['liked', ...lib.playlists.filter(pickable).map(p => p.id)];
  const using = ids.filter(id => !skipSrc.has(id)).length;
  const toggle = (id, on) => setSkipSrc(s => { const n = new Set(s); on ? n.delete(id) : n.add(id); return n; });
  const Chip = ({ children, tone }) => <span className={'shrink-0 rounded-full border px-2 py-0.5 text-[11px] ' + (tone === 'people' ? 'border-warn text-warn' : 'border-line text-muted')}>{children}</span>;
  const Row = ({ p }) => {
    const can = pickable(p);
    const chips = [];
    if (p.collaborative) chips.push(<Chip key="c" tone="people">Collaborative</Chip>);
    if (p.owner?.id !== me) chips.push(<Chip key="o" tone="people">By {p.owner?.name || 'someone else'}</Chip>);
    if (p.public === true) chips.push(<Chip key="p">Public</Chip>);
    if (p.public === false) chips.push(<Chip key="p">Private</Chip>);
    return (
      <li className={'flex items-start gap-3 py-1.5 ' + (can ? '' : 'opacity-70')}>
        {can
          ? <input id={'src' + p.id} type="checkbox" className="mt-1 h-4 w-4 accent-[var(--accent)]" checked={!skipSrc.has(p.id)} onChange={e => toggle(p.id, e.target.checked)} aria-label={'Use songs from ' + p.name} />
          : <span className="mt-1 text-muted"><Icon name="lock" className="w-4 h-4" /></span>}
        <label htmlFor={can ? 'src' + p.id : undefined} className="min-w-0 flex-1">
          <span className="block truncate text-sm font-medium">{p.name}</span>
          <span className="mt-0.5 flex flex-wrap items-center gap-1 text-xs text-muted">
            <span className="num">{can ? plural(counts[p.id] || 0, 'song') : plural(p.items?.total ?? 0, 'song')}</span>{chips}
          </span>
        </label>
      </li>
    );
  };
  const Group = ({ title, hint, list, open = true }) => list.length ? (
    <details open={open} className="border-t border-line pt-2">
      <summary className="flex items-center justify-between text-sm font-semibold">{title} <span className="text-muted font-normal num">{list.length}<Icon name="chevron" className="inline w-4 h-4 ml-1" /></span></summary>
      {hint && <p className="text-xs text-muted mt-1">{hint}</p>}
      <ul className="mt-1">{list.map(p => <Row key={p.id} p={p} />)}</ul>
    </details>
  ) : null;
  return (
    <Panel className="flex flex-col gap-2">
      <div className="flex items-center gap-2"><Icon name="list" className="w-5 h-5 text-accent" /><h2 className="text-lg font-bold">Songs come from</h2></div>
      <p className="text-sm text-muted">Tick the places to sort songs from. Crate Sorter only reads these and never changes them.</p>
      <div className="flex items-center justify-between gap-2 text-sm">
        <span className="text-muted num">Using {using} of {ids.length}</span>
        <span className="flex gap-2">
          <button className="rounded-lg border border-line px-3 py-1.5" onClick={() => setSkipSrc(new Set())}>All</button>
          <button className="rounded-lg border border-line px-3 py-1.5" onClick={() => setSkipSrc(new Set(ids))}>None</button>
        </span>
      </div>
      <label htmlFor="srcliked" className="flex items-start gap-3 py-1.5">
        <input id="srcliked" type="checkbox" className="mt-1 h-4 w-4 accent-[var(--accent)]" checked={!skipSrc.has('liked')} onChange={e => toggle('liked', e.target.checked)} />
        <span><span className="block text-sm font-medium">Liked Songs</span><span className="text-xs text-muted num">{plural(counts.liked ?? lib.likedTotal ?? lib.tracks.length, 'song')}</span></span>
      </label>
      {!lib.includeOwn && <p className="text-xs text-muted">Turn on “Read songs from my own playlists” on the start screen to choose your playlists too.</p>}
      <Group title="Your playlists" list={mine} open={mine.length <= 30} />
      <Group title="Shared with other people" hint="Collaborative playlists: other people can add or remove songs. These start unticked, so their songs are only used if you tick them. A lock means Spotify wouldn't let Crate Sorter read it." list={shared} />
      <Group title="Made by other people" hint="Playlists you follow. Spotify doesn't let apps read their songs, so they can't be used." list={others} open={false} />
      <p className="text-xs text-muted">Spotify doesn't tell apps who follows your playlists or whether you've shared a link, so playlists can only be marked by owner, collaborative and public.</p>
    </Panel>
  );
}

function TroublePanel({ report }) {
  const [text, setText] = useState('');
  const [msg, setMsg] = useState('');
  const refresh = () => { const t = report(); setText(t); return t; };
  return (
    <details className="rounded-2xl border border-line bg-surface p-4 text-sm" onToggle={e => e.currentTarget.open && refresh()}>
      <summary className="flex items-center justify-between font-semibold">Troubleshooting log<Icon name="chevron" /></summary>
      <div className="mt-3 flex flex-col gap-2">
        <p className="text-muted">Every Spotify request, wait and error is recorded here. Copy it and paste it to Claude if something goes wrong. It never includes your sign-in token or Client ID.</p>
        <div className="grid grid-cols-3 gap-2">
          <Btn kind="primary" className="px-2 py-2" onClick={() => copyText(refresh(), setMsg)}><Icon name="copy" />Copy</Btn>
          <Btn kind="ghost" className="px-2 py-2" onClick={refresh}>Update</Btn>
          <Btn kind="ghost" className="px-2 py-2" onClick={() => { debug.clear(); refresh(); setMsg('Log cleared'); setTimeout(() => setMsg(''), 2000); }}>Clear</Btn>
        </div>
        {msg && <span className="text-xs text-muted">{msg}</span>}
        <textarea id="debuglog" readOnly value={text} onFocus={e => e.target.select()} aria-label="Troubleshooting log"
          className="h-56 w-full rounded-xl border border-line bg-bg p-2 font-mono text-[11px] leading-snug" />
      </div>
    </details>
  );
}

function ClearLikedPanel({ unlike, clearable, onClear, onRestore }) {
  const [typed, setTyped] = useState('');
  if (unlike && (unlike.done || unlike.removed > 0 || unlike.backupId)) {
    const when = new Date(unlike.at).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' });
    const restoring = unlike.restored > 0 && !unlike.restoredAll;
    return (
      <Panel className="flex flex-col gap-2">
        <div className="flex items-center gap-2"><Icon name="heart" className="w-5 h-5 text-accent" /><h2 className="text-lg font-bold">Liked Songs {unlike.done ? 'cleared' : unlike.removed ? 'partly cleared' : 'not cleared yet'}</h2></div>
        <p className="text-sm text-muted">
          {when}{unlike.demo ? ' (sample library)' : ''}: {unlike.removed} of {plural(unlike.remove.length, 'song')} removed.
          {unlike.verified ? ` Every liked song is saved in the private playlist ‘${unlike.backupName}’.` : ` The backup playlist ‘${unlike.backupName}’ isn't complete yet, so nothing has been removed.`}
          {restoring && ` Restore stopped after ${unlike.restored}.`}
        </p>
        <div className={'grid gap-2 ' + (unlike.done ? 'grid-cols-1' : 'grid-cols-2')}>
          {!unlike.done && <Btn kind="danger" onClick={onClear}><Icon name="play" />Resume clearing</Btn>}
          <Btn kind="ghost" onClick={onRestore} disabled={!unlike.removed}><Icon name="undo" />Restore Liked Songs</Btn>
        </div>
      </Panel>
    );
  }
  if (!clearable) return null;
  const kept = clearable.backup.length - clearable.remove.length;
  return (
    <Panel className="flex flex-col gap-2">
      <div className="flex items-center gap-2"><Icon name="heart" className="w-5 h-5 text-accent" /><h2 className="text-lg font-bold">Clear Liked Songs (optional)</h2></div>
      <p className="text-sm text-muted">
        Removes the {plural(clearable.remove.length, 'liked song')} that are now in your new playlists.
        {kept > 0 && ` ${plural(kept, 'song')} that didn't go into a new playlist stay liked.`}
      </p>
      <p className="text-sm text-muted">First it saves every liked song to a private “Liked Songs backup” playlist and checks it. Nothing is removed unless the backup is complete, and Restore likes them all again.</p>
      {clearable.remove.length > 0 && (<>
        <label htmlFor="clearok" className="text-sm">Type <strong>clear</strong> to confirm</label>
        <input id="clearok" value={typed} onChange={e => setTyped(e.target.value)} autoCapitalize="off" autoComplete="off"
          className="rounded-lg border border-line bg-bg px-3 py-2 text-base" placeholder="clear" />
        <Btn kind="danger" disabled={typed.trim().toLowerCase() !== 'clear'} onClick={onClear}><Icon name="heart" />Clear {plural(clearable.remove.length, 'liked song')}</Btn>
      </>)}
    </Panel>
  );
}

function UndoPanel({ journal, onUndo, copy, copyMsg, needsLogin, blocked }) {
  const when = new Date(journal.at).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' });
  return (
    <Panel className="flex flex-col gap-2">
      <div className="flex items-center gap-2"><Icon name="undo" className="w-5 h-5 text-accent" /><h2 className="text-lg font-bold">Undo last run</h2></div>
      <p className="text-sm text-muted">{when}{journal.demo ? ' (sample library)' : ''}: {plural(journal.created.length, 'playlist')} created. Undo removes only these.</p>
      {needsLogin && <p className="text-sm text-warn">Connect again first, so Crate Sorter can remove them.</p>}
      {blocked && <p className="text-sm text-warn">Your liked songs were cleared and now live in these playlists. Restore Liked Songs first, then you can undo.</p>}
      <div className="grid grid-cols-2 gap-2">
        <Btn kind="ghost" onClick={copy}><Icon name="copy" />Copy record</Btn>
        <Btn kind="danger" onClick={onUndo} disabled={needsLogin || blocked}><Icon name="undo" />Undo</Btn>
      </div>
      {copyMsg && <span className="text-xs text-muted">{copyMsg}</span>}
    </Panel>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
