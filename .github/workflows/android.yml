name: Build Android app

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # The signing key is made on the first build and kept in the Actions cache, so updates
      # install over each other. If it's ever evicted, the next APK needs a fresh install.
      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: ~/.crate-signing
          key: crate-signing-key-v1

      - name: Prepare signing key
        run: |
          dir="$HOME/.crate-signing"
          if [ ! -f "$dir/key.jks" ]; then
            mkdir -p "$dir"
            openssl rand -hex 16 > "$dir/pass"
            keytool -genkeypair -keystore "$dir/key.jks" -storepass "$(cat "$dir/pass")" -keypass "$(cat "$dir/pass")" \
              -alias crate -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Crate Sorter"
          fi
          echo "::add-mask::$(cat "$dir/pass")"
          echo "SIGNING_STORE=$dir/key.jks" >> "$GITHUB_ENV"
          echo "SIGNING_PASS=$(cat "$dir/pass")" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk CrateSorter.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CrateSorter-apk
          path: CrateSorter.apk

      - name: Publish as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ github.run_number }}
          name: Crate Sorter app ${{ github.run_number }}
          files: CrateSorter.apk
          make_latest: true
          body: |
            Install on Android: download CrateSorter.apk below, open it, and allow installing from your browser if asked.
            Newer versions install over older ones and keep your data.
